# Builds the installer APK that ships inside the Magisk module.
#
# This is not a general-purpose release build: it produces a Stable-flavor APK
# with a fixed application ID (com.android.packageinstaller) and a dedicated
# signing key, because that is what the Magisk module expects when it replaces
# the system package manager. The artifact is meant to be consumed only by the
# Magisk module, never distributed as a normal app release.
#
# Triggered by pushes to main that touch application or build inputs, and
# manually from the Actions tab.
name: Magisk Module APK Build

on:
  push:
    branches: [ "main" ]
    # Build only when application code or build inputs change.
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - 'app-process/src/**'
      - 'app-process/build.gradle.kts'
      - 'hidden-api/src/**'
      - 'hidden-api/build.gradle.kts'
      - 'baselineprofile/src/**'
      - 'baselineprofile/build.gradle.kts'
      - 'build-plugins/src/**'
      - 'build-plugins/build.gradle.kts'
      - 'build-plugins/settings.gradle.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/manual-magisk-build.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name used by the Magisk module APK (e.g. 26.07); leave empty to derive it from git'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_magisk:
    name: Build Magisk Module APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Setup Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "WARNING: KEYSTORE_BASE64 secret is not set. Build will use debug keystore."
            exit 0
          fi
          mkdir -p keystore
          echo "${KEYSTORE_BASE64}" | base64 --decode > keystore/magisk.jks
          echo "KEYSTORE_FILE=keystore/magisk.jks" >> "$GITHUB_ENV"

      - name: Build Magisk Module APKs
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${{ inputs.version_name }}" ]; then
            ./gradlew assembleStableRelease \
              -PAPP_ID="com.android.packageinstaller" \
              -PVERSION_NAME="${{ inputs.version_name }}"
          else
            ./gradlew assembleStableRelease \
              -PAPP_ID="com.android.packageinstaller"
          fi

      - name: Upload Magisk Module APK
        uses: actions/upload-artifact@v7
        with:
          name: magisk-apk
          path: app/build/outputs/apk/**/release/*.apk
          if-no-files-found: error
          retention-days: 90
          archive: false
